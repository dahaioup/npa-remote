name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  linux-uos:
    # 老 glibc 发行版（UOS 20 = glibc 2.28）：原生 arm64 runner + zig 仅用来降 glibc 目标
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Checkout RustDesk libs (AGPL upstream)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common
          if [ ! -f third_party/rustdesk/libs/hbb_common/Cargo.toml ]; then
            git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common
          fi
      - name: Install zig
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> $GITHUB_PATH
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install link deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libx11-dev libxcb1-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build (glibc 2.28)
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npa-remote-linux-arm64-uos
          path: target/aarch64-unknown-linux-gnu/release/npa-remote

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: npa-remote-windows-amd64
            bin: npa-remote.exe
            vpx: "true"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: npa-remote-linux-amd64
            bin: npa-remote
            vpx: "false"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: npa-remote-linux-arm64
            bin: npa-remote
            vpx: "false"
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: npa-remote-darwin-amd64
            bin: npa-remote
            vpx: "false"
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: npa-remote-darwin-arm64
            bin: npa-remote
            vpx: "false"
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Checkout RustDesk libs (AGPL upstream)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common libs/base
          if [ ! -f third_party/rustdesk/libs/hbb_common/Cargo.toml ]; then
            git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common
          fi
          if [ ! -f third_party/rustdesk/libs/base/Cargo.toml ]; then
            git clone --depth 1 https://github.com/rustdesk/base third_party/rustdesk/libs/base
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps (dbus for enigo)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libx11-dev libxcb1-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install vpx deps (windows only)
        if: matrix.vpx == 'true'
        shell: pwsh
        run: vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static aom:x64-windows-static

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
