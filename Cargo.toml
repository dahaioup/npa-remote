[package]
name = "npa-remote"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0"
description = "NPA remote 插件：Web 远程控制 + 进阶截图/输入/剪贴板（可独立运行，也可作为 NPA 插件）"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
local-ip-address = "0.6"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
axum = { version = "0.7", default-features = false, features = ["ws", "http1", "tokio", "json", "query"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
enigo = "0.2"
arboard = "3"
xcap = "0.0.14"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# RustDesk 采集/编码（AGPL）。Windows=DXGI/macOS=Quartz 采集 + VP8 编码。
# 依赖发现：scrap build.rs 走 VCPKG_ROOT 或 homebrew Cellar（本机补丁已支持 Intel /usr/local）。
scrap = { path = "third_party/rustdesk/libs/scrap" }
base = { path = "third_party/rustdesk/libs/base" }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux：pkg-config 发现系统 libvpx/libyuv/libaom（apt 装的 -dev 包）
scrap = { path = "third_party/rustdesk/libs/scrap", features = ["linux-pkg-config"] }
base = { path = "third_party/rustdesk/libs/base" }
# xcb 用 dl 模式：运行时 dlopen 系统 libxcb.so.1。
# 静态链接 libxcb.a 时 xcb_connect 在目标机上连不上 X（UOS 39 实测 no monitors），
# 改成 dlopen 后由目标机系统库提供 libxcb，跨发行版都能用。
xcb = { version = "1.7", features = ["dl"] }

# build.rs：macOS 编译 BackingScaleFactor 最小实现（scrap Display::scale 需要）
[build-dependencies]
cc = "1"

openssl-sys = { version = "0.9", features = ["vendored"] }

# OpenSSL vendored：从源码编译，交叉编译不依赖系统头文件

# 覆盖 tokio-tungstenite：禁用 native-tls，用 rustls（交叉编译不需要 OpenSSL）
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots", "connect", "handshake"] }

[profile.release]
opt-level = 2
lto = true
strip = true
