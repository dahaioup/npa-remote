name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Checkout RustDesk libs (AGPL upstream)
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common
          if (!(Test-Path third_party\rustdesk\libs\hbb_common\Cargo.toml)) {
            git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install libvpx libyuv aom
        run: vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static aom:x64-windows-static

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npa-remote-windows-amd64
          path: target/release/npa-remote.exe
