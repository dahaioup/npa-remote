<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>NPA 远程控制</title>
<style>
  body{margin:0;background:#111;color:#ddd;font:14px system-ui}
  #bar{display:flex;gap:8px;align-items:center;padding:8px;background:#1b1b1b;flex-wrap:wrap}
  input,button,select{background:#2a2a2a;color:#ddd;border:1px solid #444;border-radius:4px;padding:4px 8px}
  button{cursor:pointer}
  #view{display:block;margin:0 auto;max-width:100vw;max-height:calc(100vh - 56px);cursor:crosshair}
  #status{font-size:12px;color:#8a8}
</style>
</head>
<body>
<div id="bar">
  <b>NPA 远程控制</b>
  <span id="status">未连接</span>
  <label>屏幕 <select id="screenSel"><option value="0">屏幕 0</option></select></label>
  <label>画质 <select id="quality"><option>50</option><option selected>70</option><option>85</option></select></label>
  <label>帧率 <select id="fps"><option>2</option><option selected>4</option><option>8</option><option>12</option></select></label>
  <input id="text" placeholder="输入文字回车发送" size="28">
  <input id="combo" placeholder="组合键 如 ctrl+v" size="12">
  <button id="btnClipSet">复制选中→剪贴板</button>
  <button id="btnClipGet">取剪贴板</button>
  <button id="btnFull">全屏</button>
  <span id="clip"></span>
</div>
<canvas id="view"></canvas>
<script>
const view = document.getElementById('view'), ctx = view.getContext('2d');
const status = document.getElementById('status');
let ws, scale = 1;
function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)); }
// WebCodecs VP8 解码（Windows 路径；JPEG 帧走 createImageBitmap）
let decoder = null, pts = 0;
function ensureDecoder(){
  if (decoder) return decoder;
  if (!window.VideoDecoder) return null;
  decoder = new VideoDecoder({
    output: f => { onFrame(f); f.close(); },
    error: e => status.textContent = '解码错误: '+e.message
  });
  decoder.configure({codec:'vp8'});
  return decoder;
}
function onFrame(source){
  if (source.width && view.width!==source.width){ view.width=source.width; view.height=source.height; }
  ctx.drawImage(source,0,0,view.width||source.width,view.height||source.height);
}
function handleBinary(buf){
  if (buf.byteLength < 6) return;
  const dv = new DataView(buf);
  const type = dv.getUint8(0), key = dv.getUint8(1);
  const len = dv.getUint32(2,true);
  const data = new Uint8Array(buf,6,len);
  if (type===1){ // JPEG
    createImageBitmap(new Blob([data],{type:'image/jpeg'})).then(bmp=>{ onFrame(bmp); bmp.close(); });
  } else if (type===2){ // VP8
    const dec = ensureDecoder();
    if (!dec){ status.textContent='浏览器不支持 WebCodecs'; return; }
    dec.decode(new EncodedVideoChunk({
      type: key? 'key':'delta',
      timestamp: pts += 66000,
      data
    }));
  }
}
function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = ()=> status.textContent='已连接';
  ws.onclose = ()=> { status.textContent='断开，2s 后重连'; setTimeout(connect,2000); };
  ws.onmessage = (m)=>{
    if(m.data instanceof ArrayBuffer){
      handleBinary(m.data);
    } else {
      const v = JSON.parse(m.data);
      if(v.t==='clip') document.getElementById('clip').textContent = v.text||'(空)';
      if(v.t==='pos'){
        status.textContent = `已连接 · 鼠标 ${v.x},${v.y} · 屏幕 ${v.screen_w}x${v.screen_h}`;
        // 多屏下拉
        if(Array.isArray(v.screens) && v.screens.length){
          const sel = document.getElementById('screenSel');
          const cur = sel.value;
          const sig = v.screens.map(s=>s.id+':'+s.w+'x'+s.h).join(',');
          if(sel.dataset.sig !== sig){
            sel.dataset.sig = sig;
            sel.innerHTML = v.screens.map(s=>`<option value="${s.id}">屏幕 ${s.id} (${s.w}x${s.h})</option>`).join('');
            sel.value = String(v.screen ?? 0);
          }
        }
      }
    }
  };
}
connect();
setInterval(()=>send({t:'pos'}), 3000);

// 画布坐标 → 屏幕坐标（JPEG 帧即全屏，直接按 canvas 实际尺寸映射）
function toScreen(e){
  const r = view.getBoundingClientRect();
  const x = Math.round((e.clientX-r.left)/r.width*view.width);
  const y = Math.round((e.clientY-r.top)/r.height*view.height);
  return {x,y};
}
view.addEventListener('mousemove', e=>{ const p=toScreen(e); send({t:'move',x:p.x,y:p.y}); });
view.addEventListener('click', e=>{ const p=toScreen(e); send({t:'click',x:p.x,y:p.y,button:'left'}); });
view.addEventListener('contextmenu', e=>{ e.preventDefault(); const p=toScreen(e); send({t:'click',x:p.x,y:p.y,button:'right'}); });
view.addEventListener('dblclick', e=>{ const p=toScreen(e); send({t:'click',x:p.x,y:p.y,button:'left',count:2}); });
view.addEventListener('wheel', e=>{ e.preventDefault(); send({t:'scroll',dy:Math.sign(e.deltaY)*120}); }, {passive:false});

document.getElementById('quality').onchange = e=> send({t:'quality',v:+e.target.value});
document.getElementById('screenSel').onchange = e=> send({t:'screen',id:+e.target.value});
document.getElementById('fps').onchange = e=> send({t:'fps',v:+e.target.value});
document.getElementById('text').onkeydown = e=>{
  if(e.key==='Enter'){ const t=e.target.value; e.target.value=''; send({t:'type',text:t}); }
};
document.getElementById('combo').onkeydown = e=>{
  if(e.key==='Enter'){ const c=e.target.value; e.target.value=''; send({t:'hotkey',combo:c}); }
};
document.getElementById('btnClipSet').onclick = ()=> send({t:'clip_set',text:document.getElementById('text').value});
document.getElementById('btnClipGet').onclick = ()=> send({t:'clip_get'});
document.getElementById('btnFull').onclick = ()=> view.requestFullscreen?.();
// 本地键盘拦截：焦点不在输入框时，把按键当组合键透传
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  const parts=[];
  if(e.ctrlKey) parts.push('ctrl'); if(e.metaKey) parts.push('cmd');
  if(e.altKey) parts.push('alt'); if(e.shiftKey) parts.push('shift');
  const k = e.key.length===1? e.key : e.key.toLowerCase();
  if(['Control','Meta','Alt','Shift'].includes(e.key)) return;
  parts.push(k); e.preventDefault(); send({t:'hotkey',combo:parts.join('+')});
});
</script>
</body>
</html>
