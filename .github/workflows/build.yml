name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout RustDesk libs (AGPL upstream)
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common
          git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common 2>$null; if ($LASTEXITCODE -ne 0) { $true }

      - uses: lukka/get-vcpkg@v11
      - name: Install libvpx
        run: |
          vcpkg install libvpx:x64-windows-static
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npa-remote-windows-amd64
          path: target/release/npa-remote.exe
