name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  linux-uos:
    # 老 glibc 发行版（UOS 20 = glibc 2.28）：原生 arm64 runner + zig 仅用来降 glibc 目标
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Checkout RustDesk libs (AGPL upstream)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common
          if [ ! -f third_party/rustdesk/libs/hbb_common/Cargo.toml ]; then
            git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common
          fi
      - name: Patch scrap for rust 1.100
        run: |
          sed -i 's/breakdown_signal_handler as _/breakdown_signal_handler as *const () as _/' third_party/rustdesk/libs/base/src/platform/mod.rs
      - name: Install zig
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> $GITHUB_PATH
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install link deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libx11-dev libxcb1-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install vpx deps (linux-uos)
        run: |
          sudo apt-get install -y libvpx-dev libyuv-dev libaom-dev libxcb-shm0-dev libxcb-randr0-dev libssl-dev
          sudo mkdir -p /usr/include/openssl
          sudo ln -sf /usr/include/aarch64-linux-gnu/openssl/opensslconf.h /usr/include/openssl/opensslconf.h
          sudo ln -sf /usr/include/aarch64-linux-gnu/openssl/configuration.h /usr/include/openssl/configuration.h 2>/dev/null || true
      - name: Build (glibc 2.28)
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28
        env:
          # webm-sys 的 libwebm C++ 代码在新 GCC 上缺 #include <cstdint>，强制注入
          CXXFLAGS: "-include cstdint"
          # openssl-sys：显式指向系统 OpenSSL（zigcc 的默认搜索路径找不到）
          OPENSSL_DIR: /usr
          OPENSSL_INCLUDE_DIR: /usr/include
          OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
      - name: Pack (UPX)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
          BIN=target/aarch64-unknown-linux-gnu/release/npa-remote
          BEFORE=$(wc -c < "$BIN")
          upx -9 "$BIN"
          echo "pack: $BEFORE -> $(wc -c < "$BIN")"
          "$BIN" --help > /dev/null
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npa-remote-linux-arm64-uos
          path: target/aarch64-unknown-linux-gnu/release/npa-remote

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: npa-remote-windows-amd64
            bin: npa-remote.exe
            vpx: "true"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: npa-remote-linux-amd64
            bin: npa-remote
            vpx: "false"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: npa-remote-linux-arm64
            bin: npa-remote
            vpx: "false"
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Checkout RustDesk libs (AGPL upstream)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common
          if [ ! -f third_party/rustdesk/libs/hbb_common/Cargo.toml ]; then
            git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps (dbus for enigo)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libx11-dev libxcb1-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install vpx deps (windows only)
        if: matrix.vpx == 'true'
        shell: pwsh
        run: vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static aom:x64-windows-static

      - name: Install vpx deps (linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libvpx-dev libyuv-dev libaom-dev libxcb-shm0-dev libxcb-randr0-dev libssl-dev
          sudo mkdir -p /usr/include/openssl
          sudo ln -sf /usr/include/aarch64-linux-gnu/openssl/opensslconf.h /usr/include/openssl/opensslconf.h
          sudo ln -sf /usr/include/aarch64-linux-gnu/openssl/configuration.h /usr/include/openssl/configuration.h 2>/dev/null || true
          # Ubuntu 的 libyuv-dev 不提供 .pc 文件，手动写让 pkg-config 能找到
          LIBYUV_PC="/usr/lib/x86_64-linux-gnu/pkgconfig/libyuv.pc"
          sudo mkdir -p "$(dirname "$LIBYUV_PC")"
          sudo tee "$LIBYUV_PC" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/lib/x86_64-linux-gnu
          includedir=${prefix}/include
          Name: libyuv
          Description: YUV conversion library
          Version: 0.0.1922
          Libs: -L${libdir} -lyuv
          Cflags: -I${includedir}
          PCEOF
          # arm64 runner 路径不同
          if [ -d /usr/lib/aarch64-linux-gnu ]; then
            LIBYUV_PC_ARM="/usr/lib/aarch64-linux-gnu/pkgconfig/libyuv.pc"
            sudo mkdir -p "$(dirname "$LIBYUV_PC_ARM")"
            sudo tee "$LIBYUV_PC_ARM" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/lib/aarch64-linux-gnu
          includedir=${prefix}/include
          Name: libyuv
          Description: YUV conversion library
          Version: 0.0.1922
          Libs: -L${libdir} -lyuv
          Cflags: -I${includedir}
          PCEOF
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # webm-sys 的 libwebm C++ 代码在新 GCC 上缺 #include <cstdint>，强制注入
          CXXFLAGS: "-include cstdint"

      - name: Pack (UPX)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          BEFORE=$(wc -c < "$BIN")
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -fsSL --http1.1 -o /tmp/upx.zip https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-win64.zip
            unzip -qo /tmp/upx.zip -d /tmp/upx
            UPX=$(ls /tmp/upx/upx-*/upx.exe | head -1)
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
            UPX=upx
          fi
          "$UPX" -9 "$BIN"
          AFTER=$(wc -c < "$BIN")
          echo "pack: $BEFORE -> $AFTER"
          # 冒烟：UPX 后必须还能跑，跑不起来就让 job 失败
          "$BIN" --help > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  macos-manual:
    # macOS 构建改手动触发：免费 runner 排队严重（4h+ queued），本机 Intel Mac 编译更快，
    # 此 job 仅在 workflow_dispatch 时按需补官方 CI 构件。
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: npa-remote-darwin-amd64
            bin: npa-remote
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: npa-remote-darwin-arm64
            bin: npa-remote
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout RustDesk libs (AGPL upstream)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common
          if [ ! -f third_party/rustdesk/libs/hbb_common/Cargo.toml ]; then
            git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common
          fi
      - name: Install vpx deps (macOS)
        run: |
          brew install libvpx aom
          # libyuv 不在 homebrew：源码装进 Cellar（scrap build.rs 只扫 Cellar 目录）
          PREFIX="$( [ "$(uname -m)" = "arm64" ] && echo /opt/homebrew || echo /usr/local )/Cellar/libyuv/0.0.1"
          git clone --depth 1 https://chromium.googlesource.com/chromium/src/third_party/libyuv /tmp/libyuv \
            || git clone --depth 1 https://github.com/lemenkov/libyuv /tmp/libyuv
          cmake -S /tmp/libyuv -B /tmp/libyuv/build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build /tmp/libyuv/build -j4
          cmake --install /tmp/libyuv/build
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Pack (UPX 4.2.4, macOS)
        run: |
          # brew 的 upx 5.3.0 其 --force-macos 产出的二进制启动即崩，必须用 4.2.4 源码版
          curl -fsSL --http1.1 -o /tmp/upx-src.tar.xz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-src.tar.xz
          tar -xJf /tmp/upx-src.tar.xz -C /tmp
          cmake -S /tmp/upx-4.2.4-src -B /tmp/upx-4.2.4-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/upx-4.2.4-src/build -j4 --target upx
          BIN=target/${{ matrix.target }}/release/${{ matrix.bin }}
          BEFORE=$(wc -c < "$BIN")
          # arm64-macos 不受支持（打包失败保留原文件），amd64 走 --force-macos
          /tmp/upx-4.2.4-src/build/upx -9 "$BIN" \
            || /tmp/upx-4.2.4-src/build/upx --force-macos -9 "$BIN" \
            || true
          echo "pack: $BEFORE -> $(wc -c < "$BIN")"
          # 冒烟：压过必须能跑，没压成（arm64）跑原版也应通过
          "$BIN" --help > /dev/null
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
