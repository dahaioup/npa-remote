name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  linux-uos-static:
    # UOS 20（glibc 2.28 / arm64）构件：libvpx + libyuv + aom 全部**静态链接**。
    # 目标机（39）只有 libvpx.so.5 / libaom.so.0（SONAME 与符号都和 Ubuntu 24 的
    # libvpx.so.9 对不上），动态链的构件在它上面根本起不来——静态自包含才可用。
    # 做法参考 RustDesk 的 linux 构建：vcpkg 静态包；这里用 zig cc 直接从源码
    # 编三套库（vcpkg 在 arm64 上编 libvpx 太慢），产物同样零 .so 依赖。
    runs-on: ubuntu-24.04-arm
    env:
      ZIG_TARGET: aarch64-linux-gnu.2.28
      STATIC_ROOT: /opt/npa-static
    steps:
      - uses: actions/checkout@v4
      - name: Checkout RustDesk libs (AGPL upstream)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common
          if [ ! -f third_party/rustdesk/libs/hbb_common/Cargo.toml ]; then
            git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common
          fi
      - name: Patch scrap for rust 1.100
        run: |
          sed -i 's/breakdown_signal_handler as _/breakdown_signal_handler as *const () as _/' third_party/rustdesk/libs/base/src/platform/mod.rs
      - name: Patch scrap for static link (cross build)
        run: python3 scripts/patch-scrap-static.py
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build llvm pkg-config libclang-dev \
            libdbus-1-dev libx11-dev libxcb1-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libssl-dev libxcb-shm0-dev libxcb-randr0-dev
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> $GITHUB_PATH
          cargo install cargo-zigbuild --locked
          # zig cc 包装：CMake 里直接指定编译器，自动带上目标三元组与 glibc 版本
          # zig 包装脚本放在仓库里（scripts/zig-cc.sh、scripts/zig-cxx.sh）：
          # 固定目标三元组并过滤 libyuv 探测出的 -march=armv8.2（zig 0.13 不认）。
          sudo cp scripts/zig-cc.sh /usr/local/bin/zig-cc
          sudo cp scripts/zig-cxx.sh /usr/local/bin/zig-c++
          sudo chmod +x /usr/local/bin/zig-cc /usr/local/bin/zig-c++
          sudo mkdir -p /usr/include/openssl
          sudo ln -sf /usr/include/aarch64-linux-gnu/openssl/opensslconf.h /usr/include/openssl/opensslconf.h
          sudo ln -sf /usr/include/aarch64-linux-gnu/openssl/configuration.h /usr/include/openssl/configuration.h 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Build static libvpx (make)
        run: |
          # libvpx 从 2021 起主构建系统是 **make**（仓库里没有 CMakeLists.txt，
          # RustDesk/vcpkg 走的也是 configure+make）。用 zig cc 做交叉编译器，
          # 通过 ${target}-gcc 形式的 wrapper 满足 libvpx configure 的要求。
          rm -rf /tmp/libvpx /tmp/libvpx.tgz
          curl -fsSL --retry 3 -o /tmp/libvpx.tgz \
            "https://chromium.googlesource.com/webm/libvpx/+archive/HEAD.tar.gz"
          mkdir -p /tmp/libvpx && tar -xzf /tmp/libvpx.tgz -C /tmp/libvpx
          [ -x /tmp/libvpx/configure ] || { echo "ERROR: libvpx 源码异常（无 configure）"; exit 1; }
          for t in gcc g++ ld; do
            printf '#!/bin/sh\nexec /opt/zig/zig %s --target=%s "$@"\n' "$t" "$ZIG_TARGET" \
              | sudo tee /usr/local/bin/aarch64-linux-gnu-$t > /dev/null
            # 有些 toolchain 定义用的 CROSS 前缀是 arm64-linux-gnu-，两套都备上
            printf '#!/bin/sh\nexec /opt/zig/zig %s --target=%s "$@"\n' "$t" "$ZIG_TARGET" \
              | sudo tee /usr/local/bin/arm64-linux-gnu-$t > /dev/null
            sudo chmod +x /usr/local/bin/aarch64-linux-gnu-$t /usr/local/bin/arm64-linux-gnu-$t
          done
          for t in ar ranlib nm strip; do
            printf '#!/bin/sh\nexec llvm-%s "$@"\n' "$t" \
              | sudo tee /usr/local/bin/aarch64-linux-gnu-$t > /dev/null
            sudo chmod +x /usr/local/bin/aarch64-linux-gnu-$t
          done
          cd /tmp/libvpx
          # 先把当前版本的 VP8 相关 configure 选项打出来（HEAD 的选项集会随版本变动，
          # 之前 --disable-av1 / --enable-vp8-highbitdepth 都不存在于该版本）
          ./configure --help 2>/dev/null | grep -iE 'vp8|vp9|bitdepth' | head -20 || true
          # libvpx 的 --target 用它自己 toolchain.sh 里定义的名字
          # （arm64-linux-gcc / aarch64-linux-gcc … 随版本增减），不是 gcc 三元组。
          # 在整个 build/ 目录里找，探测不到就退回 libvpx 传统名 arm64-linux-gcc。
          VNX_TARGET=$(grep -rhoE '(aarch64|arm64)-linux-(gcc|gnu)' build/ 2>/dev/null | sort -u | head -1)
          [ -n "$VNX_TARGET" ] || VNX_TARGET=arm64-linux-gcc
          echo "libvpx target=$VNX_TARGET"
          ls build/make/ 2>/dev/null | head -20 || true
          ./configure --target="$VNX_TARGET" \
            --disable-examples --disable-tools --disable-unit-tests --disable-docs \
            --enable-vp9 --enable-vp8 \
            --enable-static --disable-shared --enable-pic
          make -j4
          sudo mkdir -p $STATIC_ROOT/lib $STATIC_ROOT/include
          sudo cp libvpx.a $STATIC_ROOT/lib/libnpa_vpx.a
          sudo mkdir -p $STATIC_ROOT/include/vpx
          sudo cp vpx/*.h $STATIC_ROOT/include/vpx/
      - name: Build static libyuv
        run: |
          rm -rf /tmp/libyuv /tmp/libyuv.tgz
          # chromium 的 googlesource 子目录 +archive 取不到，改用社区镜像 lemenkov/libyuv
          # 固定到 2022-12 的 commit：main 分支含 SVE2/SME 代码路径（zig 编不了，
          # 要做一堆源码改写，反而不稳）；旧版只有 NEON/通用路径。
          curl -fsSL --retry 3 -o /tmp/libyuv.tgz \
            "https://github.com/lemenkov/libyuv/archive/3abd6f36b6e4f5a2e0ce236580a8bc1da3c7cf7e.tar.gz"
          [ -s /tmp/libyuv.tgz ] || { echo "ERROR: libyuv 下载失败"; exit 1; }
          mkdir -p /tmp/libyuv && tar -xzf /tmp/libyuv.tgz -C /tmp/libyuv --strip-components=1
          [ -f /tmp/libyuv/CMakeLists.txt ] || { echo "ERROR: libyuv 无 CMakeLists.txt"; exit 1; }
          cmake -S /tmp/libyuv -B /tmp/libyuv-build -G Ninja \
            -DCMAKE_C_COMPILER=/usr/local/bin/zig-cc \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/zig-c++ \
            -DCMAKE_AR=$(command -v llvm-ar) -DCMAKE_RANLIB=$(command -v llvm-ranlib) \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLIBYUV_DISABLE_SVE=ON -DLIBYUV_DISABLE_SME=ON \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_CROSSCOMPILING=TRUE \
            -DCMAKE_C_SIZEOF_VOID_P=8 -DCMAKE_CXX_SIZEOF_VOID_P=8 \
            -DCMAKE_SIZEOF_VOID_P=8 \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH=$STATIC_ROOT
          cmake --build /tmp/libyuv-build -j4
          sudo cp /tmp/libyuv-build/libyuv.a $STATIC_ROOT/lib/libnpa_yuv.a
          sudo mkdir -p $STATIC_ROOT/include/libyuv
          sudo cp /tmp/libyuv/include/libyuv/*.h $STATIC_ROOT/include/libyuv/
      - name: Provide static aom headers (scrap 只在 AV1 路径用 aom)
        run: |
          # scrap 的 build.rs 无条件要 aom 的头文件（bindgen）与链接参数，
          # 但我们只走 VP8 路径 → 头文件用发行版的（架构无关），
          # 链接给一个桩库（scripts/aom_stub.c，空实现占位）。
          sudo apt-get install -y libaom-dev
          sudo mkdir -p $STATIC_ROOT/include/aom
          sudo cp /usr/include/aom/*.h $STATIC_ROOT/include/aom/
          # 链接用桩实现（我们只走 VP8，不编 libaom）
          /usr/local/bin/zig-cc -c scripts/aom_stub.c -o /tmp/aom_stub.o
          $(command -v llvm-ar) crs $STATIC_ROOT/lib/libnpa_aom.a /tmp/aom_stub.o
      - name: Write pkg-config (static only)
        run: |
          sudo mkdir -p $STATIC_ROOT/lib/pkgconfig
          # Libs 留空：交叉编译时 pkg-config crate 只会 emit 动态的 -lnpa_vpx，
          # 而 rustc 把这些 -l 放在 -Wl,-Bdynamic 之后，lld 就只会去找同名 .so
          # （报 "unable to find dynamic system library"）。
          # 真正的静态链接由下面 patch 过的 scrap build.rs 用
          # cargo:rustc-link-lib=static=npa_vpx 完成。
          # 库名带 npa_ 前缀：绝无可能链到系统里的 libvpx.so / libaom.so
          # （runner 上也没装 libvpx-dev/libaom-dev，链接器只会选 .a）
          printf 'prefix=%s\nlibdir=${prefix}/lib\nincludedir=${prefix}/include\nName: vpx\nDescription: static libvpx\nVersion: 1.15.0\nLibs:\nCflags: -I${includedir}\n' "$STATIC_ROOT" | sudo tee $STATIC_ROOT/lib/pkgconfig/vpx.pc
          printf 'prefix=%s\nlibdir=${prefix}/lib\nincludedir=${prefix}/include\nName: libyuv\nDescription: static libyuv\nVersion: 0.0.1\nLibs:\nCflags: -I${includedir}\n' "$STATIC_ROOT" | sudo tee $STATIC_ROOT/lib/pkgconfig/libyuv.pc
          printf 'prefix=%s\nlibdir=${prefix}/lib\nincludedir=${prefix}/include\nName: aom\nDescription: static aom\nVersion: 3.9.0\nLibs:\nCflags: -I${includedir}\n' "$STATIC_ROOT" | sudo tee $STATIC_ROOT/lib/pkgconfig/aom.pc
      - name: Build (glibc 2.28, static vpx)
        # 注意：GitHub Actions 的 env: 上下文不做变量展开，$STATIC_ROOT 会原样传下去
        # （pkg-config crate 收到字面量 '$STATIC_ROOT/lib/pkgconfig' 就找不到 .pc）。
        # 所以这里必须用 shell 的 export。
        run: |
          export CXXFLAGS="-include cstdint"
          export PKG_CONFIG_PATH="$STATIC_ROOT/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export OPENSSL_DIR=/usr
          export OPENSSL_INCLUDE_DIR=/usr/include
          export OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu
          export NPA_STATIC_LIB="$STATIC_ROOT/lib"
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28
      - name: Verify static linkage
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/npa-remote
          echo "--- NEEDED ---"
          readelf -d "$BIN" | grep NEEDED || true
          if readelf -d "$BIN" | grep -Eq 'libvpx|libyuv|libaom'; then
            echo "FAIL: 仍动态依赖 vpx/yuv/aom"
            exit 1
          fi
          echo "OK: 无 vpx/yuv/aom 动态依赖"
          file "$BIN"
      - name: Pack (UPX)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
          BIN=target/aarch64-unknown-linux-gnu/release/npa-remote
          BEFORE=$(wc -c < "$BIN")
          upx -9 "$BIN" || true
          echo "pack: $BEFORE -> $(wc -c < "$BIN")"
          "$BIN" --help > /dev/null
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npa-remote-linux-arm64-uos-static
          path: target/aarch64-unknown-linux-gnu/release/npa-remote

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: npa-remote-windows-amd64
            bin: npa-remote.exe
            vpx: "true"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: npa-remote-linux-amd64
            bin: npa-remote
            vpx: "false"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: npa-remote-linux-arm64
            bin: npa-remote
            vpx: "false"
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Checkout RustDesk libs (AGPL upstream)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common
          if [ ! -f third_party/rustdesk/libs/hbb_common/Cargo.toml ]; then
            git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps (dbus for enigo)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libx11-dev libxcb1-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install vpx deps (windows only)
        if: matrix.vpx == 'true'
        shell: pwsh
        run: vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static aom:x64-windows-static

      - name: Install vpx deps (linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libvpx-dev libyuv-dev libaom-dev libxcb-shm0-dev libxcb-randr0-dev libssl-dev
          sudo mkdir -p /usr/include/openssl
          sudo ln -sf /usr/include/aarch64-linux-gnu/openssl/opensslconf.h /usr/include/openssl/opensslconf.h
          sudo ln -sf /usr/include/aarch64-linux-gnu/openssl/configuration.h /usr/include/openssl/configuration.h 2>/dev/null || true
          # Ubuntu 的 libyuv-dev 不提供 .pc 文件，手动写
          sudo mkdir -p /usr/lib/aarch64-linux-gnu/pkgconfig
          echo 'prefix=/usr
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib/aarch64-linux-gnu
          includedir=${prefix}/include
          Name: libyuv
          Description: YUV conversion library
          Version: 0.0.1
          Libs: -L${libdir} -lyuv
          Cflags: -I${includedir}' | sudo tee /usr/lib/aarch64-linux-gnu/pkgconfig/libyuv.pc
          # Ubuntu 的 libyuv-dev 不提供 .pc 文件，手动写让 pkg-config 能找到
          LIBYUV_PC="/usr/lib/x86_64-linux-gnu/pkgconfig/libyuv.pc"
          sudo mkdir -p "$(dirname "$LIBYUV_PC")"
          sudo tee "$LIBYUV_PC" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/lib/x86_64-linux-gnu
          includedir=${prefix}/include
          Name: libyuv
          Description: YUV conversion library
          Version: 0.0.1922
          Libs: -L${libdir} -lyuv
          Cflags: -I${includedir}
          PCEOF
          # arm64 runner 路径不同
          if [ -d /usr/lib/aarch64-linux-gnu ]; then
            LIBYUV_PC_ARM="/usr/lib/aarch64-linux-gnu/pkgconfig/libyuv.pc"
            sudo mkdir -p "$(dirname "$LIBYUV_PC_ARM")"
            sudo tee "$LIBYUV_PC_ARM" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/lib/aarch64-linux-gnu
          includedir=${prefix}/include
          Name: libyuv
          Description: YUV conversion library
          Version: 0.0.1922
          Libs: -L${libdir} -lyuv
          Cflags: -I${includedir}
          PCEOF
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # webm-sys 的 libwebm C++ 代码在新 GCC 上缺 #include <cstdint>，强制注入
          CXXFLAGS: "-include cstdint"

      - name: Pack (UPX)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          BEFORE=$(wc -c < "$BIN")
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -fsSL --http1.1 -o /tmp/upx.zip https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-win64.zip
            unzip -qo /tmp/upx.zip -d /tmp/upx
            UPX=$(ls /tmp/upx/upx-*/upx.exe | head -1)
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
            UPX=upx
          fi
          "$UPX" -9 "$BIN"
          AFTER=$(wc -c < "$BIN")
          echo "pack: $BEFORE -> $AFTER"
          # 冒烟：UPX 后必须还能跑，跑不起来就让 job 失败
          "$BIN" --help > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  macos-manual:
    # macOS 构建改手动触发：免费 runner 排队严重（4h+ queued），本机 Intel Mac 编译更快，
    # 此 job 仅在 workflow_dispatch 时按需补官方 CI 构件。
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: npa-remote-darwin-amd64
            bin: npa-remote
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: npa-remote-darwin-arm64
            bin: npa-remote
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout RustDesk libs (AGPL upstream)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/rustdesk/rustdesk third_party/rustdesk
          git -C third_party/rustdesk submodule update --init libs/hbb_common
          if [ ! -f third_party/rustdesk/libs/hbb_common/Cargo.toml ]; then
            git clone --depth 1 https://github.com/rustdesk/hbb_common third_party/rustdesk/libs/hbb_common
          fi
      - name: Install vpx deps (macOS)
        run: |
          brew install libvpx aom
          # libyuv 不在 homebrew：源码装进 Cellar（scrap build.rs 只扫 Cellar 目录）
          PREFIX="$( [ "$(uname -m)" = "arm64" ] && echo /opt/homebrew || echo /usr/local )/Cellar/libyuv/0.0.1"
          git clone --depth 1 https://chromium.googlesource.com/chromium/src/third_party/libyuv /tmp/libyuv \
            || git clone --depth 1 https://github.com/lemenkov/libyuv /tmp/libyuv
          cmake -S /tmp/libyuv -B /tmp/libyuv/build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build /tmp/libyuv/build -j4
          cmake --install /tmp/libyuv/build
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Pack (UPX 4.2.4, macOS)
        run: |
          # brew 的 upx 5.3.0 其 --force-macos 产出的二进制启动即崩，必须用 4.2.4 源码版
          curl -fsSL --http1.1 -o /tmp/upx-src.tar.xz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-src.tar.xz
          tar -xJf /tmp/upx-src.tar.xz -C /tmp
          cmake -S /tmp/upx-4.2.4-src -B /tmp/upx-4.2.4-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/upx-4.2.4-src/build -j4 --target upx
          BIN=target/${{ matrix.target }}/release/${{ matrix.bin }}
          BEFORE=$(wc -c < "$BIN")
          # arm64-macos 不受支持（打包失败保留原文件），amd64 走 --force-macos
          /tmp/upx-4.2.4-src/build/upx -9 "$BIN" \
            || /tmp/upx-4.2.4-src/build/upx --force-macos -9 "$BIN" \
            || true
          echo "pack: $BEFORE -> $(wc -c < "$BIN")"
          # 冒烟：压过必须能跑，没压成（arm64）跑原版也应通过
          "$BIN" --help > /dev/null
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
